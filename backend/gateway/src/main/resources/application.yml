server.port: ${SERVER_PORT:9999}
spring.application.name: GATEWAY-SERVICE
spring.cloud.gateway.discovery.locator.enabled: true
spring.cloud.gateway.discovery.locator.lower-case-service-id: true
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping: true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins: http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods: GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers: '*'
spring.cloud.gateway.routes[0].id: customers
spring.cloud.gateway.routes[0].uri: lb://CUSTOMER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]: Path=/customers/**
spring.cloud.gateway.routes[1].id: accounts
spring.cloud.gateway.routes[1].uri: lb://EBANK-SERVICE
spring.cloud.gateway.routes[1].predicates[0]: Path=/accounts/**
spring.cloud.gateway.routes[2].id: chatbot
spring.cloud.gateway.routes[2].uri: lb://EBANK-CHATBOT
spring.cloud.gateway.routes[2].predicates[0]: Path=/chat/**
eureka.client.service-url.defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
