server:
  port: ${SERVER_PORT:8056}
spring:
  application:
    name: CUSTOMER-SERVICE
  datasource:
    url: jdbc:h2:mem:customers-db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
  cloud:
    config:
      enabled: false
eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
management:
  endpoints:
    web:
      exposure:
        include: health,info
spring.ai.mcp.server.name: customer-service
spring.ai.mcp.server.version: 1.0.0
spring.ai.mcp.server.protocol: STREAMABLE
springdoc:
  swagger-ui:
    path: /swagger-ui.html
