server:
  port: ${SERVER_PORT:8057}
spring:
  application:
    name: EBANK-SERVICE
  datasource:
    url: jdbc:h2:mem:ebank-db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
  cloud:
    config:
      enabled: false
    openfeign:
      circuitbreaker:
        enabled: true
eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info
spring.ai.mcp.server.name: ebank-service
spring.ai.mcp.server.version: 1.0.0
spring.ai.mcp.server.protocol: STREAMABLE
springdoc.swagger-ui.path: /swagger-ui.html
